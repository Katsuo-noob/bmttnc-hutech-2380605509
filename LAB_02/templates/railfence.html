<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Rail Fence Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>

<div class="container mt-5">

    <div class="text-center mb-4">
        <h2 class="font-weight-bold">RAILFENCE CIPHER</h2>
        <a href="/" class="btn btn-secondary btn-sm">
            Trang chủ
        </a>
    </div>

    <div class="row">

        <!-- Mã hóa -->
        <div class="col-md-6 mb-4">
            <div class="card">

                <div class="card-header bg-primary text-white">
                    ENCRYPTION
                </div>

                <div class="card-body">

                    <form method="POST" action="/railfence/encrypt">

                        <div class="form-group">
                            <label>Plain Text</label>
                            <input
                                type="text"
                                class="form-control"
                                name="inputPlainText"
                                placeholder="Nhập bản rõ"
                                required
                                autofocus>
                        </div>

                        <div class="form-group">
                            <label>Key</label>
                            <input
                                type="text"
                                class="form-control"
                                name="inputKeyPlain"
                                placeholder="Nhập khóa"
                                required>
                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary btn-block">
                            Encrypt
                        </button>

                    </form>

                </div>
            </div>
        </div>

        <!-- Giải mã -->
        <div class="col-md-6 mb-4">
            <div class="card">

                <div class="card-header bg-success text-white">
                    DECRYPTION
                </div>

                <div class="card-body">

                    <form method="POST" action="/railfence/decrypt">

                        <div class="form-group">
                            <label>Cipher Text</label>
                            <input
                                type="text"
                                class="form-control"
                                name="inputCipherText"
                                placeholder="Nhập bản mã"
                                required>
                        </div>

                        <div class="form-group">
                            <label>Key</label>
                            <input
                                type="text"
                                class="form-control"
                                name="inputKeyCipher"
                                placeholder="Nhập khóa"
                                required>
                        </div>

                        <button
                            type="submit"
                            class="btn btn-success btn-block">
                            Decrypt
                        </button>

                    </form>

                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
